; PlatformIO Configuration File for DTRDesk.com ESP8266 Firmware
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/generate_config.py

lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.4

; ---------------------------------------------------------------------------
; 2.8" ST7789 240x320 SPI TFT build (replaces the SSD1306 OLED).
;
;   pio run -e nodemcuv2_tft
;
; Wiring (NodeMCU): TFT SCK=D5, MOSI=D7, CS=D8, DC=D1, RST=3V3 (software
; reset), backlight=3V3, VCC=VIN(5V). The AS608 moves to RX=D2/TX=D6, LEDs to
; D0/D4 (red active-low), buzzer stays on D3. Touch and the SD slot are not
; wired (they share SPI and need a chip-select we do not have a pin for).
;
; TFT_eSPI is configured entirely from these build flags (USER_SETUP_LOADED
; skips its User_Setup.h). If the image is negative/garbled, try
; -D TFT_INVERSION_ON=1 or swap ST7789_DRIVER for ILI9341_DRIVER.
; ---------------------------------------------------------------------------
[env:nodemcuv2_tft]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/generate_config.py
build_flags =
    -D DTRDESK_DISPLAY_ST7789=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=5
    -D TFT_RST=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000

lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    bblanchon/ArduinoJson@^6.21.4
    bodmer/TFT_eSPI@^2.5.43
